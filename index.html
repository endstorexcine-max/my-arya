<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TikTok Downloader</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.container{
width:95%;
max-width:500px;
background:#1e293b;
padding:40px;
border-radius:15px;
box-shadow:0 10px 40px rgba(0,0,0,0.5);
text-align:center;
}

h1{
margin-bottom:10px;
font-size:28px;
}

p{
opacity:.7;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin-bottom:15px;
font-size:15px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#22c55e;
color:white;
font-size:16px;
cursor:pointer;
transition:.2s;
}

button:hover{
background:#16a34a;
}

.result{
margin-top:25px;
}

.video{
margin-top:15px;
}

.video video{
width:100%;
border-radius:10px;
}

.actions{
margin-top:15px;
display:flex;
gap:10px;
}

.actions a{
flex:1;
text-decoration:none;
background:#3b82f6;
padding:10px;
border-radius:8px;
color:white;
font-size:14px;
}

.actions a.mp3{
background:#f59e0b;
}

footer{
margin-top:25px;
font-size:13px;
opacity:.6;
}

.loading{
margin-top:10px;
opacity:.7;
}

</style>
</head>

<body>

<div class="container">

<h1>TikTok Downloader</h1>
<p>Download Video & MP3 TikTok tanpa watermark</p>

<input id="url" placeholder="Paste link TikTok disini">

<button onclick="download()">Download</button>

<div class="loading" id="loading"></div>

<div class="result" id="result"></div>

<footer>
Developer: 7NT-Arya
</footer>

</div>

<script>

async function download(){

let url=document.getElementById("url").value
let result=document.getElementById("result")
let loading=document.getElementById("loading")

if(!url){
alert("Masukkan link TikTok")
return
}

loading.innerText="Mengambil video..."

result.innerHTML=""

try{

let res=await fetch("https://tikwm.com/api/?url="+encodeURIComponent(url))
let data=await res.json()

loading.innerText=""

let video=data.data.play
let mp3=data.data.music
let title=data.data.title
let cover=data.data.cover

result.innerHTML=`

<h3>${title}</h3>

<div class="video">
<video controls src="${video}"></video>
</div>

<div class="actions">
<a href="${video}" target="_blank">Download Video</a>
<a class="mp3" href="${mp3}" target="_blank">Download MP3</a>
</div>

`

}catch(err){

loading.innerText=""
result.innerHTML="Gagal mengambil video"

}

}

</script>

</body>
</html>
